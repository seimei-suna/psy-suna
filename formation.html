<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEIMEI - SUNA | Formation</title>
    <meta name="description" content="Formation des psychologues de la branche psychologique SEIMEI - SUNA.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="formation">
    <div id="psy-topbar"></div>
    <div class="app-container">
        <div id="psy-auth-gate"></div>

        <div id="psy-app" class="hidden">
        <main class="content-area">

            <section class="tab-pane active">
                <div class="pane-header">
                    <span class="eyebrow">Branche Psychologique Seimei</span>
                    <h2><i class="fa-solid fa-graduation-cap"></i> Formation des nouveaux psychologues</h2>
                    <p>Ressources, exemples et grilles d'évaluation clinique. Édition réservée à la Gérance / Seimei.</p>
                </div>

                <div class="card hidden" id="formation-edit-card">
                    <div class="card-title"><i class="fa-solid fa-plus"></i> Ajouter une ressource</div>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="formation-titre">Titre</label>
                            <input type="text" id="formation-titre">
                        </div>
                        <div class="form-group full-width">
                            <label for="formation-contenu">Contenu</label>
                            <textarea id="formation-contenu" rows="5"></textarea>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" id="btn-add-formation" style="margin-top:10px;">
                        <i class="fa-solid fa-floppy-disk"></i> Ajouter
                    </button>
                </div>

                <div id="formation-list" style="margin-top:14px;"></div>
            </section>

        </main>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="config.js"></script>
    <script src="common-psy.js"></script>
    <script src="auth.js"></script>
    <script src="data.js"></script>
    <script src="formation.js"></script>
</body>
</html>
