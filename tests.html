<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEIMEI - SUNA | Registre des Tests Psychologiques</title>
    <meta name="description" content="Registre des tests psychologiques (Kensatsu, camp de redressement, BDM, entretiens cliniques) de la branche psychologique SEIMEI - SUNA.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="tests">
    <div id="psy-topbar"></div>
    <div class="app-container">
        <div id="psy-auth-gate"></div>

        <div id="psy-app" class="hidden">
        <main class="content-area">
            <section class="tab-pane active">
                <div class="pane-header">
                    <span class="eyebrow">Branche Psychologique Seimei</span>
                    <h2><i class="fa-solid fa-vial-circle-check"></i> Registre des Tests Psychologiques</h2>
                    <p>Tous les tests passés par les shinobis — Kensatsu, camps de redressement, BDM, tests libres, et entretiens cliniques complets (barème /52) — au même endroit.</p>
                </div>

                <div class="card card-glass">
                    <div class="patients-toolbar">
                        <input type="text" id="tests-search" placeholder="Rechercher un patient..." autocomplete="off">
                        <select id="tests-filter-type">
                            <option value="">Tous les types</option>
                            <option value="kensatsu">Kensatsu</option>
                            <option value="camp_redressement">Camp de redressement</option>
                            <option value="bdm">BDM</option>
                            <option value="autre">Autre</option>
                            <option value="evaluation">Entretien clinique complet</option>
                        </select>
                        <select id="tests-filter-statut">
                            <option value="">Tous les statuts</option>
                            <option value="apte">Apte</option>
                            <option value="inapte">Inapte</option>
                            <option value="a_revoir">À revoir</option>
                            <option value="sous_surveillance">Sous surveillance</option>
                        </select>
                        <button type="button" class="btn btn-primary btn-glow" id="btn-open-new-test">
                            <i class="fa-solid fa-plus"></i> Ajouter un test
                        </button>
                        <button type="button" class="btn btn-secondary" id="tests-refresh"><i class="fa-solid fa-rotate"></i> Actualiser</button>
                    </div>
                    <div id="tests-status" class="patients-status">Chargement du registre...</div>
                    <div id="tests-list" class="patients-grid"></div>
                </div>
            </section>
        </main>
        </div>
    </div>

    <!-- Modal : ajouter un test -->
    <div id="modal-new-test" class="modal-overlay hidden">
        <div class="modal-content card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-plus"></i> Ajouter un test au registre</h3>
                <button class="btn-close" id="btn-close-new-test">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="new-test-patient">Patient (nom & prénom)</label>
                        <input type="text" id="new-test-patient" list="tests-patient-list" placeholder="Ex: Gaara du Désert" required>
                        <datalist id="tests-patient-list"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="new-test-type">Type de test</label>
                        <select id="new-test-type">
                            <option value="kensatsu">Kensatsu</option>
                            <option value="camp_redressement">Camp de redressement</option>
                            <option value="bdm">BDM</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="new-test-date">Date de passation</label>
                        <input type="date" id="new-test-date">
                    </div>
                    <div class="form-group">
                        <label for="new-test-statut">Statut / conclusion rapide</label>
                        <select id="new-test-statut">
                            <option value="a_revoir">À revoir</option>
                            <option value="apte">Apte</option>
                            <option value="inapte">Inapte</option>
                            <option value="sous_surveillance">Sous surveillance</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="new-test-motif">Motif du test</label>
                        <input type="text" id="new-test-motif" placeholder="Ex: demande judiciaire, entrée en fonction, réintégration après suivi...">
                    </div>
                    <div class="form-group full-width">
                        <label for="new-test-resultat">Résultat / conclusion</label>
                        <textarea id="new-test-resultat" rows="4" placeholder="Détail du résultat et de la conclusion clinique..."></textarea>
                    </div>
                </div>
                <p id="new-test-error" style="color:#e74c3c; font-size:13px; margin-top:8px;"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="btn-cancel-new-test">Annuler</button>
                <button type="button" class="btn btn-primary" id="btn-save-new-test"><i class="fa-solid fa-floppy-disk"></i> Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modal détail -->
    <div class="dossier-modal" id="test-modal">
        <div class="dossier-modal-panel">
            <div class="dossier-modal-head">
                <h3 id="test-modal-title">Détail du test</h3>
                <button type="button" class="dossier-modal-close" id="test-modal-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="test-modal-body" class="dossier-modal-body"></div>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="config.js"></script>
    <script src="common-psy.js"></script>
    <script src="auth.js"></script>
    <script src="data.js"></script>
    <script src="tests.js"></script>
</body>
</html>
