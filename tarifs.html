<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEIMEI - SUNA | Tarifs</title>
    <meta name="description" content="Tarifs des prestations de la branche psychologique SEIMEI - SUNA — consultable par tous.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="tarifs">
    <div class="psy-shell">
    <aside id="psy-sidebar"></aside>
    <div class="psy-shell-main">
    <div class="app-container">
        <main class="content-area">
            <section class="tab-pane active">
                <div class="pane-header">
                    <span class="eyebrow">Branche Psychologique Seimei — Consultation libre</span>
                    <h2><i class="fa-solid fa-coins"></i> Tableau des tarifs</h2>
                    <p>Consultable par tous, y compris les patients. Édition réservée à la Gérance / Seimei.</p>
                </div>

                <div class="card hidden" id="tarifs-edit-card">
                    <div class="card-title"><i class="fa-solid fa-plus"></i> Ajouter une ligne</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="tarif-prestation">Prestation</label>
                            <input type="text" id="tarif-prestation" placeholder="Ex: Séance de suivi">
                        </div>
                        <div class="form-group">
                            <label for="tarif-prix">Tarif</label>
                            <input type="text" id="tarif-prix" placeholder="Ex: 200 Ryō">
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" id="btn-add-tarif" style="margin-top:10px;">
                        <i class="fa-solid fa-floppy-disk"></i> Ajouter
                    </button>
                </div>

                <div class="card table-scroll-wrap">
                    <table class="tarifs-table" id="tarifs-table">
                        <thead><tr><th>Prestation</th><th>Tarif</th><th></th></tr></thead>
                        <tbody id="tarifs-body"></tbody>
                    </table>
                    <div id="tarifs-empty" class="dossiers-empty hidden">Aucun tarif renseigné pour le moment.</div>
                </div>
            </section>
        </main>
    </div>
    </div>
    </div>

    <script src="supabase.js"></script>
    <script src="config.js"></script>
    <script src="common-psy.js"></script>
    <script src="auth.js"></script>
    <script src="tarifs.js"></script>
</body>
</html>
